{% extends 'store/base.html' %}

{% block title %}Login - Game Store{% endblock %}

{% block content %}
    <h2>Login</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>
    <p><a href="{% url 'store:register' %}">Don't have an account? Register here.</a></p>
{% endblock %}
